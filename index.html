<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện - Những tấm ảnh riêng tư</title>
    
    <!-- Nhúng Firebase SDK qua CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Nút Cài đặt tròn (Top: 15px) */
        .settings-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #cbd5e1;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .settings-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Nút Mở Trình Phát Nhạc (Top: 60px, dưới nút cài đặt) */
        .music-toggle-btn {
            position: fixed;
            top: 65px;
            left: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #94a3b8; /* Hình âm nhạc màu xám */
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .music-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Modal Cài đặt & Phát nhạc chung */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1001;
            display: none;
        }

        .custom-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 440px;
            z-index: 1002;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
            display: none;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-modal-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        .close-modal-btn:hover { color: #fff; }

        /* Giao diện Trình phát nhạc */
        .music-tabs {
            display: flex; gap: 5px; margin-bottom: 15px;
        }
        .music-tab {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; padding: 8px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .music-tab.active, .music-tab:hover { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border-color: transparent; }

        .music-player-box {
            width: 100%; min-height: 150px; background: rgba(0,0,0,0.3); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .music-player-box iframe { width: 100%; height: 152px; border: none; border-radius: 12px; }

        .music-input-group { display: flex; gap: 8px; }
        .music-input-group input {
            flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none;
        }
        .music-input-group button {
            background: #6366f1; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .music-input-group button:hover { opacity: 0.9; }

        /* Các phần Cài đặt khác */
        .settings-section { margin-bottom: 20px; }
        .settings-section h4 { font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px; }
        .sub-upload-btn {
            display: block; background: rgba(255, 255, 255, 0.08); border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.9rem; margin-bottom: 10px;
        }
        .bg-thumbnails { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .bg-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
        .bg-thumb.active { border-color: #6366f1; }
        .reset-bg-btn { background: transparent; color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; }
        .theme-options { display: flex; gap: 10px; }
        .theme-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .theme-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); border-color: transparent; }

        /* Giao diện chính */
        .header { text-align: center; margin-top: 40px; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.95rem; }

        .card {
            background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); padding: 40px; border-radius: 20px; width: 90%; max-width: 550px;
            text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
        }
        .input-field {
            width: 100%; padding: 12px 15px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #ffffff; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        .upload-btn {
            display: inline-block; background: linear-gradient(135deg, #6366f1, #a855f7); color: white;
            padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; box-sizing: border-box; margin-bottom: 15px;
        }
        #fileInput { display: none; }
        .manage-btn { background: transparent; color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }

        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 90%; max-width: 900px; margin-top: 25px; margin-bottom: 40px;
        }
        .memory-item {
            background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 12px 12px 15px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); text-align: center;
        }
        .memory-item img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .memory-item p { font-size: 0.95rem; font-weight: 600; margin-top: 10px; color: #ffffff; margin-bottom: 4px; }
        .memory-item span { font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 4px; }
        .action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        .delete-btn { background-color: #e11d48; color: white; border: none; padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; cursor: pointer; }
        .download-btn { background-color: #0ea5e9; color: white; text-decoration: none; padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; }

        /* Light Mode Styling */
        body.light-mode { background-color: #f8fafc; color: #0f172a; }
        body.light-mode .card { background: rgba(255, 255, 255, 0.85); border-color: rgba(0, 0, 0, 0.1); }
        body.light-mode .card h2, body.light-mode .header h1 { color: #0f172a; }
        body.light-mode .header p { color: #475569; }
        body.light-mode .input-field { background: rgba(0, 0, 0, 0.04); color: #0f172a; border-color: rgba(0, 0, 0, 0.12); }
        body.light-mode .memory-item { background: #ffffff; border-color: rgba(0, 0, 0, 0.1); }
        body.light-mode .memory-item p { color: #0f172a; }
        body.light-mode .custom-modal { background: rgba(255, 255, 255, 0.95); color: #0f172a; border-color: rgba(0,0,0,0.15); }
        body.light-mode .custom-modal h3, body.light-mode .settings-section h4 { color: #475569; }
        body.light-mode .settings-toggle-btn, body.light-mode .music-toggle-btn { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.15); color: #475569; }
        body.light-mode .music-tab { background: rgba(0,0,0,0.04); color: #475569; border-color: rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Nút Cài đặt (Top: 15px) -->
    <button class="settings-toggle-btn" onclick="toggleModal('settingsModal')">☰</button>

    <!-- Nút Mở Trình Phát Nhạc (Hình âm nhạc màu xám, Top: 65px) -->
    <button class="music-toggle-btn" onclick="toggleModal('musicModal')" title="Trình phát nhạc">🎵</button>

    <!-- Overlay chung cho Modal -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <!-- Modal Cài đặt -->
    <div id="settingsModal" class="custom-modal">
        <div class="modal-header">
            <h3>⚙️ Cài đặt cá nhân</h3>
            <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
        </div>
        <div class="settings-section">
            <h4>1. Đổi ảnh nền</h4>
            <label for="bgFileInput" class="sub-upload-btn">+ Tải ảnh nền từ thư viện</label>
            <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
            <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">Ảnh nền đã lưu:</div>
            <div id="bgThumbnails" class="bg-thumbnails"></div>
            <button class="reset-bg-btn" onclick="resetBackground()">Khôi phục nền mặc định</button>
        </div>
        <div class="settings-section">
            <h4>2. Chế độ hiển thị</h4>
            <div class="theme-options">
                <button class="theme-btn" onclick="setTheme('light')">☀️ Sáng</button>
                <button class="theme-btn" onclick="setTheme('dark')">🌙 Tối</button>
                <button class="theme-btn" onclick="setTheme('system')">💻 Hệ thống</button>
            </div>
        </div>
    </div>

    <!-- Modal Trình Phát Nhạc (YouTube, Spotify, Apple Music) -->
    <div id="musicModal" class="custom-modal">
        <div class="modal-header">
            <h3>🎵 Trình phát nhạc</h3>
            <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
        </div>
        
        <div class="music-tabs">
            <button class="music-tab active" onclick="switchMusicPlatform('youtube')">YouTube</button>
            <button class="music-tab" onclick="switchMusicPlatform('spotify')">Spotify</button>
            <button class="music-tab" onclick="switchMusicPlatform('apple')">Apple Music</button>
        </div>

        <div class="music-player-box" id="musicPlayerContainer">
            <!-- Khung phát nhạc mặc định YouTube (Lo-Fi Chill) -->
            <iframe id="activePlayerFrame" src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="music-input-group">
            <input type="text" id="musicSearchInput" placeholder="Dán link bài hát / playlist...">
            <button onclick="loadMusicLink()">Phát</button>
        </div>
    </div>

    <div class="header">
        <h1>🌙 THƯ VIỆN 🌙</h1>
        <p>Những tấm ảnh riêng tư</p>
    </div>

    <div class="card">
        <h2>✨ Thêm kỷ niệm mới ✨</h2>
        <input type="text" class="input-field" id="memoryName" placeholder="Tên kỷ niệm...">
        <label for="fileInput" class="upload-btn">+ Chọn ảnh để tải lên</label>
        <input type="file" id="fileInput" accept="image/*">
        <button class="manage-btn" onclick="loadGallery(true)">Quản lý ảnh</button>
    </div>

    <div id="galleryContainer" class="gallery-grid" style="display: none;"></div>

    <script>
        // --- CẤU HÌNH FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD290EyLeZaTjqV0Voe5qZuvO2U93Rx5l0",
            authDomain: "idontknow-b0342.firebaseapp.com",
            projectId: "idontknow-b0342",
            storageBucket: "idontknow-b0342.firebasestorage.app",
            messagingSenderId: "691001919172",
            appId: "1:691001919172:web:b02ba2d1c23bef7b6f6b91"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myUserId = localStorage.getItem('myUniqueUserId');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('myUniqueUserId', myUserId);
        }

        // --- ĐIỀU KHIỂN MODAL CHUNG ---
        function toggleModal(modalId) {
            closeAllModals();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(modalId).style.display = 'block';
            if(modalId === 'settingsModal') renderBgThumbnails();
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('settingsModal').style.display = 'none';
            document.getElementById('musicModal').style.display = 'none';
        }

        // --- TÍNH NĂNG NHẠC (YOUTUBE, SPOTIFY, APPLE MUSIC) ---
        let currentPlatform = 'youtube';

        function switchMusicPlatform(platform) {
            currentPlatform = platform;
            const tabs = document.querySelectorAll('.music-tab');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const input = document.getElementById('musicSearchInput');
            if (platform === 'youtube') {
                input.placeholder = "Dán link YouTube hoặc Video ID...";
            } else if (platform === 'spotify') {
                input.placeholder = "Dán link bài hát/playlist Spotify...";
            } else if (platform === 'apple') {
                input.placeholder = "Dán link bài hát Apple Music...";
            }
        }

        function loadMusicLink() {
            const inputVal = document.getElementById('musicSearchInput').value.trim();
            const container = document.getElementById('musicPlayerContainer');
            if (!inputVal) return;

            if (currentPlatform === 'youtube') {
                let videoId = inputVal;
                if (inputVal.includes('youtu.be/')) {
                    videoId = inputVal.split('youtu.be/')[1].split('?')[0];
                } else if (inputVal.includes('watch?v=')) {
                    videoId = inputVal.split('watch?v=')[1].split('&')[0];
                }
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } 
            else if (currentPlatform === 'spotify') {
                // Chuyển link Spotify thông thường sang link embed widget
                let embedUrl = inputVal;
                if (inputVal.includes('spotify.com/')) {
                    embedUrl = inputVal.replace('spotify.com/', 'spotify.com/embed/');
                }
                container.innerHTML = `<iframe src="${embedUrl}?utm_source=generator" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
            }
            else if (currentPlatform === 'apple') {
                // Chuyển link Apple Music sang embed widget
                let embedUrl = inputVal;
                if (inputVal.includes('music.apple.com')) {
                    embedUrl = inputVal.replace('music.apple.com', 'embed.music.apple.com');
                }
                container.innerHTML = `<iframe allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" frameborder="0" height="150" style="width:100%;max-width:660px;overflow:hidden;background:transparent;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="${embedUrl}"></iframe>`;
            }
        }

        // --- CÀI ĐẶT NỀN & THEME ---
        const bgFileInput = document.getElementById('bgFileInput');
        bgFileInput.addEventListener('change', function() {
            const file = bgFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                let bgList = JSON.parse(localStorage.getItem('myBackgrounds')) || [];
                if (!bgList.includes(base64Url)) {
                    bgList.unshift(base64Url);
                    if (bgList.length > 10) bgList.pop();
                    localStorage.setItem('myBackgrounds', JSON.stringify(bgList));
                }
                applyBackground(base64Url);
                renderBgThumbnails();
                bgFileInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        function applyBackground(url) {
            if (url) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${url}')`;
                localStorage.setItem('selectedBg', url);
            } else {
                document.body.style.backgroundImage = 'none';
                localStorage.removeItem('selectedBg');
            }
        }

        function resetBackground() { applyBackground(null); }

        function renderBgThumbnails() {
            const container = document.getElementById('bgThumbnails');
            if (!container) return;
            let bgList = JSON.parse(localStorage.getItem('myBackgrounds')) || [];
            let currentBg = localStorage.getItem('selectedBg');
            if (bgList.length === 0) {
                container.innerHTML = '<span style="font-size:0.75rem; color:#94a3b8;">Chưa có ảnh nền nào</span>';
                return;
            }
            container.innerHTML = '';
            bgList.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'bg-thumb' + (url === currentBg ? ' active' : '');
                img.onclick = () => applyBackground(url);
                container.appendChild(img);
            });
        }

        function setTheme(mode) {
            localStorage.setItem('themeSetting', mode);
            applyTheme(mode);
        }

        function applyTheme(mode) {
            const body = document.body;
            if (mode === 'light') body.classList.add('light-mode');
            else if (mode === 'dark') body.classList.remove('light-mode');
            else if (mode === 'system') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) body.classList.remove('light-mode');
                else body.classList.add('light-mode');
            }
        }

        // --- UPLOAD & QUẢN LÝ ẢNH (FIRESTORE & CLOUDINARY) ---
        const fileInput = document.getElementById('fileInput');
        const memoryName = document.getElementById('memoryName');

        fileInput.addEventListener('change', async function() {
            const file = fileInput.files[0];
            if (!file) return;
            const name = memoryName.value.trim() || "Kỷ niệm không tên";
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'idontknow');

            try {
                alert('Đang tải ảnh lên kho lưu trữ chung...');
                const response = await fetch('https://api.cloudinary.com/v1_1/egzgqmsa/image/upload', {
                    method: 'POST', body: formData
                });
                const data = await response.json();
                
                await db.collection('memories').add({
                    name: name, url: data.secure_url,
                    date: new Date().toLocaleDateString('vi-VN'),
                    uploaderId: myUserId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Tải ảnh thành công!');
                memoryName.value = ''; fileInput.value = '';
                loadGallery(true);
            } catch (error) {
                alert('Tải ảnh thất bại, vui lòng kiểm tra lại!');
            }
        });

        function loadGallery(shouldScroll = false) {
            const gallery = document.getElementById('galleryContainer');
            gallery.style.display = 'grid';
            gallery.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #94a3b8;">Đang đồng bộ kho lưu trữ...</p>';

            db.collection('memories').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                gallery.innerHTML = '';
                if (snapshot.empty) {
                    gallery.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #94a3b8;">Chưa có kỷ niệm nào...</p>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const item = doc.data();
                    const docId = doc.id;
                    let deleteBtn = item.uploaderId === myUserId ? `<button class="delete-btn" onclick="deleteMemory('${docId}')">Xóa ảnh</button>` : '';

                    gallery.innerHTML += `
                        <div class="memory-item">
                            <img src="${item.url}" alt="${item.name}">
                            <p>${item.name}</p>
                            <span>${item.date || ''}</span>
                            <div class="action-btns">
                                <a href="${item.url}" target="_blank" download class="download-btn">Tải về</a>
                                ${deleteBtn}
                            </div>
                        </div>
                    `;
                });
                if (shouldScroll) gallery.scrollIntoView({ behavior: 'smooth' });
            });
        }

        async function deleteMemory(docId) {
            if (confirm('Bạn có chắc chắn muốn xóa ảnh này?')) {
                await db.collection('memories').doc(docId).delete();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedBg = localStorage.getItem('selectedBg');
            if (savedBg) applyBackground(savedBg);
            setTheme(localStorage.getItem('themeSetting') || 'dark');
            loadGallery(false);
        });
    </script>
</body>
</html>

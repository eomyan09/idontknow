<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện - Những tấm ảnh riêng tư</title>
    
    <!-- Nhúng Firebase SDK qua CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* CSS cơ bản và Glassmorphism */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Nút Cài đặt tròn góc trên bên trái (Đường kính ~1cm / 38px) */
        .settings-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #cbd5e1;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
            padding: 0;
            line-height: 1;
        }

        .settings-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Overlay nền mờ khi mở menu cài đặt */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1001;
        }

        /* Khung Modal Cài đặt */
        .settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            z-index: 1002;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .settings-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: #fff;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section h4 {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .sub-upload-btn {
            display: block;
            background: rgba(255, 255, 255, 0.08);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .sub-upload-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .bg-thumbnails-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .bg-thumbnails {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .bg-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }

        .bg-thumb:hover {
            transform: scale(1.05);
        }

        .bg-thumb.active {
            border-color: #6366f1;
        }

        .reset-bg-btn {
            background: transparent;
            color: #e11d48;
            border: 1px solid rgba(225, 29, 72, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .reset-bg-btn:hover {
            background: rgba(225, 29, 72, 0.1);
        }

        .theme-options {
            display: flex;
            gap: 10px;
        }

        .theme-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .theme-btn:hover, .theme-btn.active {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-color: transparent;
        }

        /* Giao diện chính */
        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .upload-btn:hover {
            opacity: 0.9;
        }

        #fileInput {
            display: none;
        }

        .manage-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .manage-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Giao diện lưới chứa các bức ảnh kiểu thẻ bài */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 900px;
            margin-top: 25px;
            margin-bottom: 40px;
        }

        .memory-item {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 12px 12px 15px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .memory-item:hover {
            transform: translateY(-5px);
        }

        .memory-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }

        .memory-item p {
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 10px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .memory-item span {
            font-size: 0.75rem;
            color: #94a3b8;
            display: block;
            margin-top: 4px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .delete-btn {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #be123c;
        }

        .download-btn {
            background-color: #0ea5e9;
            color: white;
            text-decoration: none;
            border: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            display: inline-block;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #0284c7;
        }

        /* --- STYLING CHO CHẾ ĐỘ SÁNG (LIGHT MODE) --- */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode .card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        body.light-mode .card h2, body.light-mode .header h1 {
            color: #0f172a;
        }
        body.light-mode .header p {
            color: #475569;
        }
        body.light-mode .input-field {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #0f172a;
        }
        body.light-mode .input-field::placeholder {
            color: #94a3b8;
        }
        body.light-mode .manage-btn {
            color: #475569;
            border-color: rgba(0, 0, 0, 0.15);
        }
        body.light-mode .manage-btn:hover {
            color: #0f172a;
            border-color: rgba(0, 0, 0, 0.4);
        }
        body.light-mode .memory-item {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        body.light-mode .memory-item p {
            color: #0f172a;
        }
        body.light-mode .memory-item span {
            color: #64748b;
        }
        body.light-mode .settings-modal {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #0f172a;
        }
        body.light-mode .settings-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        body.light-mode .settings-section h4, body.light-mode .bg-thumbnails-title, body.light-mode .close-modal-btn {
            color: #475569;
        }
        body.light-mode .sub-upload-btn {
            background: rgba(0, 0, 0, 0.03);
            border: 1px dashed rgba(0, 0, 0, 0.2);
            color: #0f172a;
        }
        body.light-mode .sub-upload-btn:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        body.light-mode .settings-toggle-btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #475569;
        }
        body.light-mode .settings-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #0f172a;
        }
        body.light-mode .theme-btn {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Nút mở Cài đặt (Tròn 38px ở góc trên bên trái) -->
    <button class="settings-toggle-btn" onclick="toggleSettingsMenu()">☰</button>

    <!-- Modal Cài đặt -->
    <div id="settingsOverlay" class="settings-overlay" style="display: none;" onclick="toggleSettingsMenu()"></div>
    <div id="settingsModal" class="settings-modal" style="display: none;">
        <div class="settings-header">
            <h3>⚙️ Cài đặt cá nhân</h3>
            <button class="close-modal-btn" onclick="toggleSettingsMenu()">✕</button>
        </div>
        
        <!-- Mục 1: Nền -->
        <div class="settings-section">
            <h4>1. Đổi ảnh nền</h4>
            <label for="bgFileInput" class="sub-upload-btn">+ Tải ảnh nền từ thư viện</label>
            <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
            
            <div class="bg-thumbnails-title">Ảnh nền đã lưu trước đó:</div>
            <div id="bgThumbnails" class="bg-thumbnails"></div>
            <button class="reset-bg-btn" onclick="resetBackground()">Khôi phục nền mặc định</button>
        </div>

        <!-- Mục 2: Chế độ -->
        <div class="settings-section">
            <h4>2. Chế độ hiển thị</h4>
            <div class="theme-options">
                <button class="theme-btn" onclick="setTheme('light')">☀️ Sáng</button>
                <button class="theme-btn" onclick="setTheme('dark')">🌙 Tối</button>
                <button class="theme-btn" onclick="setTheme('system')">💻 Hệ thống</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>🌕 I DON'T KNOW 🌕</h1>
        <p>Thích lưu gì thì lưu :))</p>
    </div>

    <div class="card">
        <h2>✨ Thêm kỷ niệm mới ✨</h2>
        
        <!-- Ô nhập tên kỷ niệm -->
        <input type="text" class="input-field" id="memoryName" placeholder="Tên kỷ niệm...">

        <!-- Nút chọn ảnh -->
        <label for="fileInput" class="upload-btn">
            + Chọn ảnh để tải lên
        </label>
        <input type="file" id="fileInput" accept="image/*">

        <!-- Nút quản lý ảnh -->
        <button class="manage-btn" onclick="loadGallery(true)">Quản lý ảnh</button>
    </div>

    <!-- Khung lưới hiển thị danh sách ảnh -->
    <div id="galleryContainer" class="gallery-grid" style="display: none;"></div>

    <script>
        // --- CẤU HÌNH FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD290EyLeZaTjqV0Voe5qZuvO2U93Rx5l0",
            authDomain: "idontknow-b0342.firebaseapp.com",
            projectId: "idontknow-b0342",
            storageBucket: "idontknow-b0342.firebasestorage.app",
            messagingSenderId: "691001919172",
            appId: "1:691001919172:web:b02ba2d1c23bef7b6f6b91"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Tạo hoặc lấy User ID riêng cho thiết bị này để phân quyền xóa ảnh
        let myUserId = localStorage.getItem('myUniqueUserId');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('myUniqueUserId', myUserId);
        }

        // --- XỬ LÝ CÀI ĐẶT (MENU, NỀN, CHẾ ĐỘ) ---
        function toggleSettingsMenu() {
            const modal = document.getElementById('settingsModal');
            const overlay = document.getElementById('settingsOverlay');
            const isOpen = modal.style.display === 'block';
            modal.style.display = isOpen ? 'none' : 'block';
            overlay.style.display = isOpen ? 'none' : 'block';
        }

        const bgFileInput = document.getElementById('bgFileInput');
        bgFileInput.addEventListener('change', function() {
            const file = bgFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                let bgList = JSON.parse(localStorage.getItem('myBackgrounds')) || [];
                if (!bgList.includes(base64Url)) {
                    bgList.unshift(base64Url);
                    if (bgList.length > 10) bgList.pop();
                    localStorage.setItem('myBackgrounds', JSON.stringify(bgList));
                }
                applyBackground(base64Url);
                renderBgThumbnails();
                bgFileInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        function applyBackground(url) {
            if (url) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${url}')`;
                localStorage.setItem('selectedBg', url);
            } else {
                document.body.style.backgroundImage = 'none';
                localStorage.removeItem('selectedBg');
            }
            renderBgThumbnails();
        }

        function resetBackground() {
            applyBackground(null);
        }

        function renderBgThumbnails() {
            const container = document.getElementById('bgThumbnails');
            if (!container) return;
            let bgList = JSON.parse(localStorage.getItem('myBackgrounds')) || [];
            let currentBg = localStorage.getItem('selectedBg');

            if (bgList.length === 0) {
                container.innerHTML = '<span style="font-size:0.75rem; color:#94a3b8;">Chưa có ảnh nền nào được lưu</span>';
                return;
            }

            container.innerHTML = '';
            bgList.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'bg-thumb' + (url === currentBg ? ' active' : '');
                img.onclick = () => applyBackground(url);
                container.appendChild(img);
            });
        }

        function setTheme(mode) {
            localStorage.setItem('themeSetting', mode);
            applyTheme(mode);
            updateThemeButtonsActiveState(mode);
        }

        function applyTheme(mode) {
            const body = document.body;
            if (mode === 'light') {
                body.classList.add('light-mode');
            } else if (mode === 'dark') {
                body.classList.remove('light-mode');
            } else if (mode === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.remove('light-mode');
                } else {
                    body.classList.add('light-mode');
                }
            }
        }

        function updateThemeButtonsActiveState(mode) {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(mode === 'light' ? 'sáng' : mode === 'dark' ? 'tối' : 'hệ thống')) {
                    btn.classList.add('active');
                }
            });
        }

        // --- XỬ LÝ UPLOAD KỶ NIỆM LÊN CLOUDINARY & LƯU LÊN FIREBASE FIRESTORE ---
        const fileInput = document.getElementById('fileInput');
        const memoryName = document.getElementById('memoryName');

        fileInput.addEventListener('change', async function() {
            const file = fileInput.files[0];
            if (!file) return;

            const name = memoryName.value.trim() || "Kỷ niệm không tên";
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'idontknow');

            try {
                alert('Đang tải ảnh lên kho lưu trữ chung, vui lòng đợi :))');
                
                const response = await fetch('https://api.cloudinary.com/v1_1/egzgqmsa/image/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                const imageUrl = data.secure_url;

                // Lưu dữ liệu lên Firestore để đồng bộ mọi thiết bị
                await db.collection('memories').add({
                    name: name,
                    url: imageUrl,
                    date: new Date().toLocaleDateString('vi-VN'),
                    uploaderId: myUserId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Đã lưu kỷ niệm vào kho chung thành công!');
                memoryName.value = '';
                fileInput.value = '';

                loadGallery(true);

            } catch (error) {
                console.error('Lỗi khi tải ảnh:', error);
                alert('Tải ảnh thất bại, vui lòng kiểm tra lại kết nối!');
            }
        });

        // Lấy dữ liệu trực tiếp từ Firestore (real-time)
        function loadGallery(shouldScroll = false) {
            const gallery = document.getElementById('galleryContainer');
            gallery.style.display = 'grid';
            gallery.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #94a3b8;">Đang đồng bộ kho lưu trữ...</p>';

            db.collection('memories').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                gallery.innerHTML = '';
                
                if (snapshot.empty) {
                    gallery.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #94a3b8;">Chưa có kỷ niệm nào trong kho chung...</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const item = doc.data();
                    const docId = doc.id;
                    
                    // Chỉ hiển thị nút xóa nếu máy hiện tại là người đã tải ảnh này lên
                    let deleteButtonHtml = '';
                    if (item.uploaderId === myUserId) {
                        deleteButtonHtml = `<button class="delete-btn" onclick="deleteMemory('${docId}')">Xóa ảnh</button>`;
                    }

                    gallery.innerHTML += `
                        <div class="memory-item">
                            <img src="${item.url}" alt="${item.name}">
                            <p>${item.name}</p>
                            <span>${item.date || '02/11/2026'}</span>
                            <div class="action-btns">
                                <a href="${item.url}" target="_blank" download class="download-btn">Tải về</a>
                                ${deleteButtonHtml}
                            </div>
                        </div>
                    `;
                });

                if (shouldScroll) {
                    gallery.scrollIntoView({ behavior: 'smooth' });
                }
            });
        }

        async function deleteMemory(docId) {
            if (confirm('Bạn có chắc chắn muốn xóa ảnh này khỏi kho chung?')) {
                try {
                    await db.collection('memories').doc(docId).delete();
                } catch (error) {
                    console.error('Lỗi khi xóa:', error);
                    alert('Không thể xóa ảnh, vui lòng thử lại!');
                }
            }
        }

        // Khởi chạy ngay khi vừa vào trang web
        window.addEventListener('DOMContentLoaded', () => {
            const savedBg = localStorage.getItem('selectedBg');
            if (savedBg) {
                applyBackground(savedBg);
            }
            renderBgThumbnails();

            const savedTheme = localStorage.getItem('themeSetting') || 'dark';
            setTheme(savedTheme);

            loadGallery(false);
        });
    </script>
</body>
</html>

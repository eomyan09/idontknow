<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Don't Know - Thư viện ảnh</title>
    
    <!-- Nhúng Firebase SDK qua CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Nút Cài đặt tròn (Top: 15px) */
        .settings-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #cbd5e1;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .settings-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Modal Cài đặt */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1001;
            display: none;
        }

        .custom-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            z-index: 1002;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
            display: none;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-modal-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        .close-modal-btn:hover { color: #fff; }

        .settings-section { margin-bottom: 20px; }
        .settings-section h4 { font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px; }
        
        .sub-upload-btn {
            display: block; background: rgba(255, 255, 255, 0.08); border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.9rem; margin-bottom: 10px;
        }
        .sub-upload-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .bg-thumbnails { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .bg-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
        .bg-thumb.active { border-color: #6366f1; }
        
        .reset-bg-btn { background: transparent; color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; }
        
        .theme-options { display: flex; gap: 10px; }
        .theme-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .theme-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); border-color: transparent; }

        /* Giao diện chính */
        .header { text-align: center; margin-top: 50px; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.95rem; }

        .card {
            background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); padding: 40px; border-radius: 20px; width: 90%; max-width: 550px;
            text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); margin-bottom: 20px; box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .card.dragover {
            border: 2px dashed #6366f1;
            background: rgba(99, 102, 241, 0.15);
        }

        .input-field {
            width: 100%; padding: 12px 15px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #ffffff; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        .upload-btn {
            display: inline-block; background: linear-gradient(135deg, #6366f1, #a855f7); color: white;
            padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; box-sizing: border-box; margin-bottom: 15px;
        }
        #fileInput { display: none; }
        .manage-btn { background: transparent; color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }

        /* Thanh điều khiển hiển thị (Mới nhất / Cũ nhất) */
        .controls-container {
            width: 90%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .sort-select {
            background: rgba(17, 24, 39, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Khu vực phân chia theo tháng */
        .month-section {
            width: 90%;
            max-width: 900px;
            margin-bottom: 30px;
        }
        .month-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .gallery-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            width: 100%;
        }

        .memory-item {
            background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 12px 12px 15px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); text-align: center;
        }
        .memory-item img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .memory-item p { font-size: 0.95rem; font-weight: 600; margin-top: 10px; color: #ffffff; margin-bottom: 4px; }
        .memory-item span { font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 4px; }
        .action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        .delete-btn { background-color: #e11d48; color: white; border: none; padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; cursor: pointer; }
        .download-btn { background-color: #0ea5e9; color: white; text-decoration: none; padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; }

        /* Light Mode Styling */
        body.light-mode { background-color: #f8fafc; color: #0f172a; }
        body.light-mode .card { background: rgba(255, 255, 255, 0.85); border-color: rgba(0, 0, 0, 0.1); }
        body.light-mode .card h2, body.light-mode .header h1 { color: #0f172a; }
        body.light-mode .header p { color: #475569; }
        body.light-mode .input-field { background: rgba(0, 0, 0, 0.04); color: #0f172a; border-color: rgba(0, 0, 0, 0.12); }
        body.light-mode .memory-item { background: #ffffff; border-color: rgba(0, 0, 0, 0.1); }
        body.light-mode .memory-item p { color: #0f172a; }
        body.light-mode .custom-modal { background: rgba(255, 255, 255, 0.95); color: #0f172a; border-color: rgba(0,0,0,0.15); }
        body.light-mode .custom-modal h3, body.light-mode .settings-section h4 { color: #475569; }
        body.light-mode .settings-toggle-btn { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.15); color: #475569; }
        body.light-mode .sort-select { background: rgba(255, 255, 255, 0.9); color: #0f172a; border-color: rgba(0, 0, 0, 0.15); }
        body.light-mode .month-title { color: #475569; border-color: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <!-- Nút Cài đặt (Top: 15px) -->
    <button class="settings-toggle-btn" onclick="toggleModal('settingsModal')">☰</button>

    <!-- Overlay chung -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <!-- Modal Cài đặt -->
    <div id="settingsModal" class="custom-modal">
        <div class="modal-header">
            <h3>⚙️ Cài đặt cá nhân</h3>
            <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
        </div>
        <div class="settings-section">
            <h4>1. Đổi ảnh nền</h4>
            <label for="bgFileInput" class="sub-upload-btn">+ Tải ảnh nền từ thư viện</label>
            <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
            <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">Ảnh nền đã lưu:</div>
            <div id="bgThumbnails" class="bg-thumbnails"></div>
            <button class="reset-bg-btn" onclick="resetBackground()">Khôi phục nền mặc định</button>
        </div>
        <div class="settings-section">
            <h4>2. Chế độ hiển thị</h4>
            <div class="theme-options">
                <button class="theme-btn" onclick="setTheme('light')">☀️ Sáng</button>
                <button class="theme-btn" onclick="setTheme('dark')">🌙 Tối</button>
                <button class="theme-btn" onclick="setTheme('system')">💻 Hệ thống</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>I DON'T KNOW</h1>
        <p>Thích lưu gì thì lưu :))</p>
    </div>

    <!-- Khung thêm kỷ niệm & Hỗ trợ kéo thả nhiều file -->
    <div class="card" id="dropZone">
        <h2>✨ Thêm kỷ niệm mới ✨</h2>
        <input type="text" class="input-field" id="memoryName" placeholder="Tên chung cho các ảnh (tùy chọn)...">
        <label for="fileInput" class="upload-btn">+ Chọn nhiều ảnh hoặc kéo thả vào đây</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button class="manage-btn" onclick="loadGallery(true)">Quản lý ảnh</button>
    </div>

    <!-- Thanh lựa chọn Mới nhất / Cũ nhất -->
    <div class="controls-container">
        <select id="sortSelect" class="sort-select" onchange="loadGallery(false)">
            <option value="desc">Mới nhất</option>
            <option value="asc">Cũ nhất</option>
        </select>
    </div>

    <!-- Khung chứa gallery phân nhóm theo tháng -->
    <div id="galleryContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

    <script>
        // --- CẤU HÌNH FIREBASE RIÊNG CHO IDONTKNOW ---
        const firebaseConfig = {
            apiKey: "AIzaSyBe82TCKrsTNrWyRopuHHgAEWDRmiWed5o",
            authDomain: "idontknow-b0342.firebaseapp.com",
            projectId: "idontknow-b0342",
            storageBucket: "idontknow-b0342.firebasestorage.app",
            messagingSenderId: "293881146251",
            appId: "1:293881146251:web:62306e755b25d0aaa45d8e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myUserId = localStorage.getItem('idontknow_UserId');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('idontknow_UserId', myUserId);
        }

        // --- ĐIỀU KHIỂN MODAL ---
        function toggleModal(modalId) {
            closeAllModals();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(modalId).style.display = 'block';
            if(modalId === 'settingsModal') renderBgThumbnails();
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('settingsModal').style.display = 'none';
        }

        // --- CÀI ĐẶT NỀN & THEME ---
        const bgFileInput = document.getElementById('bgFileInput');
        bgFileInput.addEventListener('change', function() {
            const file = bgFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                let bgList = JSON.parse(localStorage.getItem('idontknow_Backgrounds')) || [];
                if (!bgList.includes(base64Url)) {
                    bgList.unshift(base64Url);
                    if (bgList.length > 10) bgList.pop();
                    localStorage.setItem('idontknow_Backgrounds', JSON.stringify(bgList));
                }
                applyBackground(base64Url);
                renderBgThumbnails();
                bgFileInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        function applyBackground(url) {
            if (url) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${url}')`;
                localStorage.setItem('idontknow_SelectedBg', url);
            } else {
                document.body.style.backgroundImage = 'none';
                localStorage.removeItem('idontknow_SelectedBg');
            }
        }

        function resetBackground() { applyBackground(null); }

        function renderBgThumbnails() {
            const container = document.getElementById('bgThumbnails');
            if (!container) return;
            let bgList = JSON.parse(localStorage.getItem('idontknow_Backgrounds')) || [];
            let currentBg = localStorage.getItem('idontknow_SelectedBg');
            if (bgList.length === 0) {
                container.innerHTML = '<span style="font-size:0.75rem; color:#94a3b8;">Chưa có ảnh nền nào</span>';
                return;
            }
            container.innerHTML = '';
            bgList.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'bg-thumb' + (url === currentBg ? ' active' : '');
                img.onclick = () => applyBackground(url);
                container.appendChild(img);
            });
        }

        function setTheme(mode) {
            localStorage.setItem('idontknow_Theme', mode);
            applyTheme(mode);
        }

        function applyTheme(mode) {
            const body = document.body;
            if (mode === 'light') body.classList.add('light-mode');
            else if (mode === 'dark') body.classList.remove('light-mode');
            else if (mode === 'system') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) body.classList.remove('light-mode');
                else body.classList.add('light-mode');
            }
        }

        // --- XỬ LÝ KÉO THẢ & CHỌN NHIỀU FILE ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const memoryName = document.getElementById('memoryName');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                handleFiles(fileInput.files);
            }
        });

        // --- UPLOAD NHIỀU ẢNH LÊN CLOUDINARY & LƯU FIREBASE ---
        async function handleFiles(files) {
            const baseName = memoryName.value.trim() || "Kỷ niệm";
            let successCount = 0;

            alert(`Đang chuẩn bị tải lên ${files.length} ảnh lên kho lưu trữ...`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'idontknow');

                try {
                    const response = await fetch('https://api.cloudinary.com/v1_1/egzgqmsa/image/upload', {
                        method: 'POST', 
                        body: formData
                    });
                    const data = await response.json();
                    
                    const photoName = files.length > 1 ? `${baseName} (${i + 1})` : baseName;

                    await db.collection('memories').add({
                        name: photoName, 
                        url: data.secure_url,
                        date: new Date().toLocaleDateString('vi-VN'),
                        uploaderId: myUserId,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    successCount++;
                } catch (error) {
                    console.error("Lỗi khi tải ảnh:", error);
                }
            }

            alert(`Đã tải lên thành công ${successCount}/${files.length} ảnh!`);
            memoryName.value = ''; 
            fileInput.value = '';
            loadGallery(true);
        }

        // --- TẢI & PHÂN NHÓM HIỂN THỊ THEO THÁNG & SẮP XẾP ---
        function loadGallery(shouldScroll = false) {
            const gallery = document.getElementById('galleryContainer');
            const sortOrder = document.getElementById('sortSelect').value;
            gallery.innerHTML = '<p style="text-align: center; color: #94a3b8; margin-top: 20px;">Đang đồng bộ kho lưu trữ...</p>';

            db.collection('memories').onSnapshot((snapshot) => {
                gallery.innerHTML = '';
                if (snapshot.empty) {
                    gallery.innerHTML = '<p style="text-align: center; color: #94a3b8; margin-top: 20px;">Chưa có kỷ niệm nào...</p>';
                    return;
                }

                let items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });

                // Sắp xếp theo Mới nhất / Cũ nhất
                items.sort((a, b) => {
                    let timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    let timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
                });

                // Phân nhóm theo Tháng và Năm ("Tháng XX năm YYYY")
                let grouped = {};
                let groupKeys = [];

                items.forEach((item) => {
                    let dateObj = item.createdAt ? item.createdAt.toDate() : new Date();
                    let month = dateObj.getMonth() + 1;
                    let year = dateObj.getFullYear();
                    let key = `Tháng ${month < 10 ? '0' + month : month} năm ${year}`;
                    
                    if (!grouped[key]) {
                        grouped[key] = [];
                        groupKeys.push(key);
                    }
                    grouped[key].push(item);
                });

                if (sortOrder === 'asc') {
                    groupKeys.reverse();
                }

                // Render nhóm tháng ra màn hình
                groupKeys.forEach((key) => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'month-section';
                    sectionDiv.innerHTML = `<div class="month-title">📅 ${key}</div>`;
                    
                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'gallery-grid';

                    grouped[key].forEach((item) => {
                        const docId = item.id;
                        let deleteBtn = item.uploaderId === myUserId ? `<button class="delete-btn" onclick="deleteMemory('${docId}')">Xóa ảnh</button>` : '';

                        gridDiv.innerHTML += `
                            <div class="memory-item">
                                <img src="${item.url}" alt="${item.name}">
                                <p>${item.name}</p>
                                <span>${item.date || ''}</span>
                                <div class="action-btns">
                                    <a href="${item.url}" target="_blank" download class="download-btn">Tải về</a>
                                    ${deleteBtn}
                                </div>
                            </div>
                        `;
                    });

                    sectionDiv.appendChild(gridDiv);
                    gallery.appendChild(sectionDiv);
                });

                if (shouldScroll) gallery.scrollIntoView({ behavior: 'smooth' });
            }, (error) => {
                console.error("Lỗi Firestore:", error);
                gallery.innerHTML = '<p style="text-align: center; color: #e11d48; margin-top: 20px;">Lỗi kết nối cơ sở dữ liệu!</p>';
            });
        }

        async function deleteMemory(docId) {
            if (confirm('Bạn có chắc chắn muốn xóa ảnh này?')) {
                await db.collection('memories').doc(docId).delete();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedBg = localStorage.getItem('idontknow_SelectedBg');
            if (savedBg) applyBackground(savedBg);
            setTheme(localStorage.getItem('idontknow_Theme') || 'dark');
            loadGallery(false);
        });
    </script>
</body>
</html>
